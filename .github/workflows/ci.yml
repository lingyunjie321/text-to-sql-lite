name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-unit-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Unit + security regression with coverage
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -m pytest -q -p no:cacheprovider \
            --cov --cov-report=term --cov-report=xml \
            tests/unit tests/security

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  backend-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.14-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
        env:
          POSTGRES_DB: pagila
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pagila"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Fetch locked Pagila fixture
        run: |
          python tools/fetch_pagila.py \
            --manifest infrastructure/pagila/manifest.json \
            --output tests/fixtures/pagila/upstream

      - name: Load Pagila schema and data
        env:
          PGPASSWORD: ci-postgres-password
        run: |
          psql -h 127.0.0.1 -U postgres -d pagila -v ON_ERROR_STOP=1 \
            -f tests/fixtures/pagila/upstream/pagila-schema.sql
          psql -h 127.0.0.1 -U postgres -d pagila -v ON_ERROR_STOP=1 \
            -f tests/fixtures/pagila/upstream/pagila-data.sql

      - name: Create read-only CI role
        env:
          PGPASSWORD: ci-postgres-password
        run: |
          psql -h 127.0.0.1 -U postgres -d pagila -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE ci_readonly LOGIN PASSWORD 'ci-readonly-password';
          ALTER ROLE ci_readonly SET default_transaction_read_only = on;
          GRANT CONNECT ON DATABASE pagila TO ci_readonly;
          GRANT USAGE ON SCHEMA public TO ci_readonly;
          GRANT SELECT ON ALL TABLES IN SCHEMA public TO ci_readonly;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO ci_readonly;
          SQL

      - name: Integration regression
        env:
          TEXT_TO_SQL_DATABASE_DSN: postgresql://ci_readonly:ci-readonly-password@127.0.0.1:5432/pagila
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -m pytest -q -p no:cacheprovider \
            tests/integration

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" pip-audit

      - name: Audit known vulnerabilities
        run: pip-audit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
