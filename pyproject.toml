[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "text-to-sql-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.139.2",
  "psycopg[binary]==3.3.4",
  "psycopg-pool==3.3.1",
  "PyMySQL==1.2.0",
  "pydantic-settings==2.14.2",
  "sqlglot==30.13.0",
  "langgraph==1.2.9",
]

[project.optional-dependencies]
test = [
  "httpx2==2.9.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
]

[tool.setuptools.packages.find]
include = ["app*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: cross-component integration test; external dependencies are defined by its fixture or test documentation",
]

[tool.coverage.run]
source = ["app", "evaluation", "tools"]
branch = true
omit = [
  "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]
